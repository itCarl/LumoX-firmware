; ── Lumox firmware build configurations ──────────────────────────────────
; Two envs:
;   esp32dev  — production. Quiet serial, smallest flash, IDF logs off.
;               `pio run`            (default)
;               `pio run -t upload`
;   debug     — development. Full IDF logs (CORE_DEBUG_LEVEL=5) + Lumox
;               periodic dumps (LUMOX_DEBUG=1).
;               `pio run -e debug -t upload`
;               `pio device monitor`

[platformio]
default_envs = esp32dev

; ── Shared settings (both envs) ──────────────────────────────────────────
[env]
; pioarduino fork — arduino-esp32 v3.x with W5500 support in ETH.h.
; Unifies WiFi + Ethernet under lwIP → AsyncWebServer + Art-Net UDP work on
; both interfaces from a single socket.
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board         = esp32dev
framework     = arduino
monitor_speed = 115200
; min_spiffs.csv: 1.9 MB app / 190 KB SPIFFS (vs default 1.3 MB / 1.5 MB).
; Lumox doesn't use SPIFFS — web UI is PROGMEM gzip — so we trade FS space
; for app headroom.
board_build.partitions = min_spiffs.csv
; Drop Bluetooth/BLE libs — arduino-esp32 v3.x sometimes pulls BT init code
; through transitive WiFi includes. We don't use radio-side BT.
lib_ignore    =
    BluetoothSerial
    BLE
    SimpleBLE
extra_scripts =
    pre:pio-scripts/build_ui.py
    pre:pio-scripts/patch_esp_dmx.py
lib_deps      =
    someweisguy/esp_dmx                @ ^4.1.0
    bblanchon/ArduinoJson              @ ^7.0.0
    ayushsharma82/ElegantOTA           @ ^3.1.0
    esp32async/AsyncTCP                @ ^3.3.5
    esp32async/ESPAsyncWebServer       @ ^3.7.10

; ── Production env (default) ─────────────────────────────────────────────
; Boot / event prints stay (always useful when something goes wrong).
; Periodic chatty logs (debugEthStatus, ETH status dump) compiled out via
; LUMOX_DEBUG=0. IDF ESP_LOG* compiled out via CORE_DEBUG_LEVEL=0.
[env:esp32dev]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DLUMOX_DEBUG=0

; ── Debug env ────────────────────────────────────────────────────────────
; Full firehose: IDF verbose logs + Lumox periodic dumps.
[env:debug]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DLUMOX_DEBUG=1
