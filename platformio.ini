[env:esp32dev]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
platform_packages =
    framework-arduinoespressif32 @ ~3.20014.0
build_flags   =
    -DCORE_DEBUG_LEVEL=3
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DWEBSOCKETS_USE_SSL=0
    ; NOTE: CONFIG_LWIP_UDP_RECVMBOX_SIZE (default 6) cannot be raised here —
    ; arduino-esp32's lwIP is pre-compiled in the framework and the flag is
    ; overridden by sdkconfig.h. Would need a custom IDF build. Art-Net burst
    ; absorption on the WiFi path is therefore limited by the 6-packet mbox.
extra_scripts =
    pre:pio-scripts/build_ui.py
    pre:pio-scripts/patch_ethernet.py
lib_deps      =
    arduino-libraries/Ethernet
    someweisguy/esp_dmx                @ ^4.1.0
    bblanchon/ArduinoJson              @ ^7.0.0
    links2004/WebSockets               @ 2.6.0
    ayushsharma82/ElegantOTA           @ ^3.1.0
    esp32async/AsyncTCP                @ ^3.3.5
    esp32async/ESPAsyncWebServer       @ ^3.7.10
